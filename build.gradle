plugins {
    id 'java'
    id 'application'
}

group = 'net.badfalcon'
version = '1.1.0'

application {
    mainClass = 'com.gmail.badfalcon610.SkinEditor'
}

repositories {
    mavenCentral()
    // JogAmp stopped publishing to Maven Central after 2.3.2;
    // newer JOGL releases (with e.g. Apple Silicon natives) live here.
    maven {
        url = 'https://jogamp.org/deployment/maven/'
    }
}

ext {
    joglVersion = '2.5.0'
}

dependencies {
    implementation "org.jogamp.gluegen:gluegen-rt-main:${joglVersion}"
    implementation "org.jogamp.jogl:jogl-all-main:${joglVersion}"
    implementation 'com.formdev:flatlaf:3.7.1'
}

tasks.withType(JavaCompile).configureEach {
    // Build with any JDK 17+, produce Java 17 compatible bytecode
    options.release = 17
    options.encoding = 'UTF-8'
}

jar {
    manifest {
        attributes 'Main-Class': application.mainClass
    }

    // Bundle all runtime dependencies (JOGL + natives) into a single runnable jar
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

defaultTasks 'clean', 'build'

tasks.register('zipApp', Zip) {
    dependsOn jar
    archiveFileName = "${project.name}${project.version}.zip"

    from jar
    from 'SkinEditor_License.txt'
}

build.dependsOn 'zipApp'
